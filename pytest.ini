[pytest]
# Configuración de Pytest para API Bancaria

# Patrones de archivos de prueba
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directorios donde buscar pruebas
testpaths = tests

# Configuración de asyncio para pruebas asíncronas
asyncio_mode = auto

# Marcadores personalizados
markers =
    unit: Pruebas unitarias (fast, isolated)
    integration: Pruebas de integración (may use external resources)
    slow: Pruebas lentas (database, API calls)
    auth: Pruebas de autenticación y autorización

# Opciones por defecto
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:cacheprovider

# Cobertura de código
[coverage:run]
source = aplicaciones_web
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
